[package]
name = "waschbar"
version = "1.1.4"
edition = "2024"
rust-version = "1.88"
description = "Waschbar: UCI chess engine with NNUE evaluation (Rust port of the original C++ Waschbar)"
license = "GPL-3.0-only"

[[bin]]
name = "waschbar"
path = "src/main.rs"

[dependencies]
shakmaty = "0.30.1"
shakmaty-syzygy = "0.28.1"

[profile.release]
opt-level     = 3
lto           = "fat"   # whole-program inlining across crate boundaries
codegen-units = 1       # no per-unit boundaries limiting LTO / inlining
panic         = "abort" # no unwinding tables; nothing uses catch_unwind
debug         = true    # symbols for profiling (perf / flamegraph); no runtime cost

# `cargo test` runs perft and NNUE walks: optimise them even in the test profile
[profile.test]
opt-level = 3
